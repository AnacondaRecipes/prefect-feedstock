{% set name = "prefect" %}
{% set version = "2.10.19" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.io/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: cc8920f1f77151e617ac2dae3aa57cbbb6984a443eb84c6b6ff1ad672c74ea0a

build:
  noarch: python
  number: 0
  script: {{ PYTHON }} -m pip install --no-deps --no-build-isolation -vv .
  entry_points:
    - prefect = prefect.cli:app

requirements:
  host:
    - python >=3.7,<3.12
    - pip
    - setuptools
  run:
    - python >=3.7,<3.12
    - aiosqlite >=0.17.0
    - alembic >=1.7.5
    - anyio >=3.4.0,<4.0.0
    - apprise >=1.1.0
    - asgi-lifespan >=1.0
    - asyncpg >=0.23
    - click >=8.0,< 8.2
    - cloudpickle >=2.0
    - coolname >=1.0.4
    - croniter >=1.0.12
    - cryptography >=36.0.1
    - dateparser >=1.1.1
    - docker-py >=4.0
    - fastapi >=0.93
    - fsspec >=2022.5.0
    - griffe >=0.20.0,<0.22.0
    - httpx >=0.23,!=0.23.2
    - h2 >=3,<5
    - importlib-metadata >=4.4 # [py<310]
    - jinja2 >=3.0.0
    - jsonpatch >=1.32
    - jsonschema >=3.2.0,<5.0.0
    - python-kubernetes >=24.2.0
    - orjson >=3.7
    - packaging >=21.3
    - pathspec >=0.8.0
    - pendulum >=2.1.2
    - pydantic >=1.10.0,<2.0.0
    - python-slugify >=5.0
    - pytz >=2021.1
    - pyyaml >=5.4.1
    - readchar >=4.0.0
    - rich >=11.0
    - ruamel.yaml >=0.17.0
    - sqlalchemy >=1.4.22,!=1.4.33
    - greenlet !=0.4.17
    - toml >=0.10.0
    - typer >=0.4.2
    - typing-extensions >=4.1.0
    - uvicorn >=0.14.0
    - websockets >=10.4
    - cachetools

test:
  imports:
    - prefect
    - prefect.cli
  requires:
    - pip
  commands:
    - pip check
    # Check that the entrypoint is configured
    - prefect --help
    # Check that the long-form version command works (this uses a database and client)
    - prefect version

about:
  home: https://github.com/PrefectHQ/prefect
  license: Apache-2.0
  license_family: Apache
  license_file: LICENSE
  summary: The Prefect Core automation engine
  description: |
    Prefect is a workflow management system, designed for modern infrastructure
    and powered by the open-source Prefect Core workflow engine.
    Users organize `Tasks` into `Flows`, and Prefect takes care of the rest.
  doc_url: https://docs.prefect.io/

extra:
  recipe-maintainers:
    - PrefectHQ/open-source
    - serinamarie
    - Sahiler
    - cicdw